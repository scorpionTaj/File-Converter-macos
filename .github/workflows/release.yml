name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build universal app
        env:
          UNIVERSAL: "1"
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Kumquat.zip
            build/Kumquat.dmg
          generate_release_notes: true
